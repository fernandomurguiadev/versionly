<div class="auth-shell">
  <div class="auth-card">
    <h1>Enlace inválido</h1>
    <p>El link expiró o ya fue utilizado. Solicita uno nuevo.</p>
    <div class="auth-actions">
      <button class="auth-primary" type="button" (click)="resend()">Reenviar verificación</button>
      <a class="auth-secondary" routerLink="/reset">Restablecer contraseña</a>
    </div>
    <div class="auth-footer">
      <a routerLink="/login">Volver al login</a>
    </div>
  </div>
</div>
