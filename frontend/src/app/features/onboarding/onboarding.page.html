<div class="auth-shell">
  <div class="auth-card space-y-5">
    <div>
      <h1>Onboarding</h1>
      <p>Configura tu primer espacio de trabajo.</p>
    </div>

    <p *ngIf="errorMessage" class="text-sm text-rose-300">{{ errorMessage }}</p>

    <div *ngIf="step === 1" class="space-y-4">
      <div class="auth-field">
        <label for="onboarding-workspace">Nombre del workspace</label>
        <input id="onboarding-workspace" type="text" placeholder="Equipo producto" [(ngModel)]="workspaceName" />
      </div>
      <div class="auth-actions">
        <button class="auth-primary" type="button" (click)="nextFromWorkspace()">Continuar</button>
        <button class="auth-secondary" type="button" (click)="skipToApp()">Saltar</button>
      </div>
    </div>

    <div *ngIf="step === 2" class="space-y-4">
      <div class="auth-field">
        <label for="onboarding-project">Nombre del proyecto</label>
        <input id="onboarding-project" type="text" placeholder="Manual técnico" [(ngModel)]="projectName" />
      </div>
      <div class="auth-actions">
        <button class="auth-primary" type="button" (click)="nextFromProject()">Continuar</button>
        <button class="auth-secondary" type="button" (click)="back()">Volver</button>
      </div>
    </div>

    <div *ngIf="step === 3" class="space-y-4">
      <div class="auth-field">
        <label for="onboarding-folder">Nombre de la carpeta</label>
        <input id="onboarding-folder" type="text" placeholder="Specs" [(ngModel)]="folderName" />
      </div>
      <div class="auth-actions">
        <button class="auth-primary" type="button" (click)="nextFromFolder()">Continuar</button>
        <button class="auth-secondary" type="button" (click)="back()">Volver</button>
      </div>
    </div>

    <div *ngIf="step === 4" class="space-y-4">
      <p class="text-sm text-slate-300">¿Qué quieres hacer ahora?</p>
      <div class="auth-actions">
        <button class="auth-primary" type="button" (click)="goToDocuments()">Crear documento</button>
        <button class="auth-secondary" type="button" (click)="skipToApp()">Ver workspace</button>
      </div>
    </div>
  </div>
</div>
