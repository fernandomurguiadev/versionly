<div class="auth-shell">
  <div class="auth-card">
    <h1>Crea tu cuenta</h1>
    <p>Registra tu equipo en Versionly</p>
    <div class="auth-field">
      <label for="register-name">Nombre completo</label>
      <input id="register-name" type="text" placeholder="Tu nombre" [(ngModel)]="fullName" />
    </div>
    <div class="auth-field">
      <label for="register-email">Correo electrónico</label>
      <input id="register-email" type="email" placeholder="tu@email.com" [(ngModel)]="email" />
    </div>
    <div class="auth-field">
      <label for="register-password">Contraseña</label>
      <input id="register-password" type="password" placeholder="********" [(ngModel)]="password" />
    </div>
    <div class="auth-actions">
      <button class="auth-primary" type="button" (click)="register()">Crear cuenta</button>
      <a class="auth-secondary" routerLink="/login">Ya tengo cuenta</a>
    </div>
  </div>
</div>
