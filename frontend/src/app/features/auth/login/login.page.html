<div class="auth-shell">
  <div class="auth-card">
    <h1>Bienvenido de nuevo</h1>
    <p>Accede a tu espacio de trabajo</p>
    <div class="auth-field">
      <label for="login-email">Correo electrónico</label>
      <input id="login-email" type="email" placeholder="tu@email.com" [(ngModel)]="email" />
    </div>
    <div class="auth-field">
      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" placeholder="********" [(ngModel)]="password" />
    </div>
    <div class="auth-actions">
      <button class="auth-primary" type="button" (click)="login()">Iniciar sesión</button>
      <a class="auth-secondary" routerLink="/reset">¿Olvidaste tu contraseña?</a>
    </div>
    <div class="auth-footer">
      ¿No tienes cuenta?
      <a routerLink="/register">Regístrate</a>
    </div>
  </div>
</div>
