<div class="auth-shell">
  <div class="auth-card">
    <h1>Recuperar contraseña</h1>
    <p>Enviaremos un enlace para crear una nueva contraseña.</p>
    <div class="auth-field">
      <label for="forgot-email">Correo electrónico</label>
      <input id="forgot-email" type="email" placeholder="tu@email.com" [(ngModel)]="email" />
    </div>
    <div class="auth-actions">
      <button class="auth-primary" type="button" (click)="requestReset()">Enviar enlace</button>
      <a class="auth-secondary" routerLink="/login">Volver al login</a>
    </div>
  </div>
</div>
