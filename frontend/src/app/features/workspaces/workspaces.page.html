<section class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-white">Workspaces</h1>
      <p class="text-sm text-slate-400">Selecciona un workspace para ver proyectos y documentos recientes.</p>
    </div>
    <button
      class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white"
      type="button"
      (click)="openWorkspaceModal()"
    >
      Crear workspace
    </button>
  </div>

  <div *ngIf="workspaces.length === 0" class="rounded-xl border border-dashed border-slate-800 bg-slate-900/60 p-6 text-center">
    <p class="text-sm text-slate-300">Aún no tienes workspaces.</p>
    <button class="mt-3 rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white" type="button" (click)="openWorkspaceModal()">
      Crear primer workspace
    </button>
  </div>

  <div *ngIf="workspaces.length > 0" class="grid gap-4 md:grid-cols-2">
    <a
      *ngFor="let workspace of workspaces"
      [routerLink]="['/app/workspaces', workspace.id]"
      class="rounded-xl border border-slate-800 bg-slate-900/70 p-4 transition hover:border-blue-500"
    >
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold text-white">{{ workspace.name }}</h2>
          <p class="text-sm text-slate-400">Actualizado {{ workspace.updatedAt }}</p>
        </div>
        <div class="rounded-full bg-slate-800 px-3 py-1 text-xs text-slate-200">
          {{ workspace.projects }} proyectos
        </div>
      </div>
    </a>
  </div>

  <div
    *ngIf="isWorkspaceModalOpen"
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 p-4"
  >
    <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-6">
      <h2 class="text-lg font-semibold text-white">Crear workspace</h2>
      <p class="mt-1 text-sm text-slate-400">Define un nombre para tu workspace.</p>
      <div class="mt-4">
        <label class="text-sm text-slate-300" for="workspace-name">Nombre</label>
        <input
          id="workspace-name"
          class="mt-2 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white"
          type="text"
          [(ngModel)]="workspaceName"
        />
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button class="rounded-lg border border-slate-700 px-4 py-2 text-sm text-slate-200" type="button" (click)="closeWorkspaceModal()">
          Cancelar
        </button>
        <button class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white" type="button" (click)="submitWorkspace()">
          Crear
        </button>
      </div>
    </div>
  </div>
</section>
