<div class="auth-shell">
  <div class="auth-card">
    <h1>Nueva contraseña</h1>
    <p>Define una contraseña segura para tu cuenta.</p>
    <div class="auth-field">
      <label for="reset-password">Contraseña</label>
      <input id="reset-password" type="password" placeholder="********" [(ngModel)]="password" />
    </div>
    <div class="auth-field">
      <label for="reset-confirm">Confirmar contraseña</label>
      <input id="reset-confirm" type="password" placeholder="********" [(ngModel)]="confirm" />
    </div>
    <div class="auth-actions">
      <button class="auth-primary" type="button" (click)="reset()">Actualizar contraseña</button>
      <a class="auth-secondary" routerLink="/login">Volver al login</a>
    </div>
  </div>
</div>
