<div class="min-h-screen bg-slate-950">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur">
    <div class="flex h-14 w-full items-center gap-4 px-4 sm:px-6 lg:px-8">
      <div class="text-base font-semibold text-white">Versionly</div>
      <select class="rounded-md border border-slate-800 bg-slate-900 px-2 py-1 text-xs text-slate-200">
        <option>Workspace actual</option>
      </select>
      <div class="ml-auto flex items-center gap-2">
        <input
          class="w-64 rounded-md border border-slate-800 bg-slate-900 px-3 py-1 text-sm text-slate-200"
          placeholder="Buscar en Versionly"
        />
        <a class="rounded-md border border-slate-800 px-3 py-1 text-sm text-slate-200" routerLink="/app/workspaces">Workspaces</a>
      </div>
    </div>
  </header>
  <div class="grid w-full grid-cols-[240px_1fr_360px] gap-4 px-4 py-4 sm:px-6 lg:px-8 max-[1100px]:grid-cols-[72px_1fr]">
    <aside class="rounded-lg border border-slate-800 bg-slate-900/70 p-3">
      <div class="mb-3 flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-400">Navegación</span>
        <span class="text-xs text-slate-500">↔</span>
      </div>
      <nav class="space-y-1 text-sm">
        <a routerLink="/app" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800">🏠 Inicio</a>
        <a routerLink="/app/workspaces" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800">📁 Proyectos</a>
        <a routerLink="/app/workspaces" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800">🕘 Recientes</a>
        <a routerLink="/app/workspaces" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800">⭐ Favoritos</a>
        <a routerLink="/app/workspaces" class="block rounded-md px-3 py-2 text-slate-300 hover:bg-slate-800">🔔 Notificaciones</a>
      </nav>
      <div class="my-3 h-px bg-slate-800"></div>
      <details class="rounded-md">
        <summary class="cursor-pointer select-none rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white">
          Nuevo
        </summary>
        <div class="mt-2 space-y-1 rounded-md border border-slate-800 bg-slate-900 p-2 text-sm">
          <button class="w-full rounded-md px-2 py-1 text-left text-slate-200 hover:bg-slate-800">Proyecto</button>
          <button class="w-full rounded-md px-2 py-1 text-left text-slate-200 hover:bg-slate-800">Carpeta</button>
          <button class="w-full rounded-md px-2 py-1 text-left text-slate-200 hover:bg-slate-800">Documento</button>
          <button class="w-full rounded-md px-2 py-1 text-left text-slate-200 hover:bg-slate-800">Importar</button>
        </div>
      </details>
    </aside>
    <main class="min-w-0 space-y-4">
      <router-outlet></router-outlet>
    </main>
    <aside class="rounded-lg border border-slate-800 bg-slate-900/70 p-3 max-[1100px]:hidden">
      <div class="text-sm font-semibold text-white">Inspector</div>
      <p class="mt-2 text-xs text-slate-400">Historial, metadata o comparación aparecerán aquí.</p>
    </aside>
  </div>
</div>
