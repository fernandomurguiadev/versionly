<section class="rounded-lg border border-slate-800 bg-white p-6">
  <div class="mb-3 flex items-center justify-between">
    <div class="text-sm text-slate-500">Contenido actual</div>
    <div class="rounded-full bg-slate-100 px-3 py-1 text-xs text-slate-600">{{ contentVersionLabel || 'Sin versión actual' }}</div>
  </div>
  <div *ngIf="contentError" class="rounded-md border border-red-700 bg-red-900/30 p-3 text-sm text-red-200">
    {{ contentError }}
  </div>
  <div class="mx-auto max-w-[920px] rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
    <div [innerHTML]="contentHtml"></div>
  </div>
</section>
