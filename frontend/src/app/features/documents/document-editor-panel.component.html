<div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
  <div class="flex flex-wrap items-center gap-2 border-b border-slate-800 pb-3">
    <select
      class="rounded-md border border-slate-800 bg-slate-950/70 px-2 py-1 text-xs text-white"
      [(ngModel)]="selectedFont"
      (ngModelChange)="setFontName($event)"
    >
      <option *ngFor="let font of availableFonts" [value]="font">{{ font }}</option>
    </select>
    <select
      class="rounded-md border border-slate-800 bg-slate-950/70 px-2 py-1 text-xs text-white"
      [(ngModel)]="selectedFontSize"
      (ngModelChange)="setFontSize($event)"
    >
      <option *ngFor="let size of fontSizeOptions" [value]="size.value">{{ size.label }}</option>
    </select>
    <div class="h-6 w-px bg-slate-800"></div>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.applyFormat('bold')">
      B
    </button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs italic text-white" type="button" (click)="commands.applyFormat('italic')">
      I
    </button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs underline text-white" type="button" (click)="commands.applyFormat('underline')">
      U
    </button>
    <div class="h-6 w-px bg-slate-800"></div>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.setAlignment('left')">↤</button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.setAlignment('center')">↔</button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.setAlignment('right')">↦</button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.setAlignment('justify')">☰</button>
    <div class="h-6 w-px bg-slate-800"></div>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.insertOrderedList()">1.</button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.insertUnorderedList()">•</button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.insertLink()">🔗</button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.insertImage()">🖼</button>
    <button class="rounded-md border border-slate-800 px-2 py-1 text-xs text-white" type="button" (click)="commands.insertTable()">▦</button>
    <div class="h-6 w-px bg-slate-800"></div>
    <select
      class="rounded-md border border-slate-800 bg-slate-950/70 px-2 py-1 text-xs text-white"
      [(ngModel)]="selectedLineSpacing"
      (ngModelChange)="setLineSpacing($event)"
    >
      <option *ngFor="let spacing of lineSpacingOptions" [value]="spacing.value">{{ spacing.label }}</option>
    </select>
    <select
      class="rounded-md border border-slate-800 bg-slate-950/70 px-2 py-1 text-xs text-white"
      [(ngModel)]="selectedParagraphSpacing"
      (ngModelChange)="setParagraphSpacing($event)"
    >
      <option *ngFor="let spacing of paragraphSpacingOptions" [value]="spacing.value">{{ spacing.label }} px</option>
    </select>
    <select
      class="rounded-md border border-slate-800 bg-slate-950/70 px-2 py-1 text-xs text-white"
      [(ngModel)]="selectedPageMargin"
      (ngModelChange)="setPageMargin($event)"
    >
      <option *ngFor="let margin of pageMarginOptions" [value]="margin.value">{{ margin.label }} px</option>
    </select>
    <button class="ml-auto rounded-md bg-blue-600 px-3 py-1 text-xs font-semibold text-white" type="button" (click)="saveDraft()">
      Guardar borrador
    </button>
  </div>
  <div class="mt-3 min-h-[360px] rounded-lg border border-slate-200 bg-white">
    <div
      #editor
      class="min-h-[360px] outline-none"
      contenteditable="true"
      [attr.contenteditable]="canEdit"
      (input)="onEditorInput($event)"
      (keydown)="onEditorKeydown($event)"
    ></div>
  </div>
  <div class="mt-3 flex flex-wrap gap-3 text-xs">
    <span class="rounded-full border border-emerald-500/40 bg-emerald-500/10 px-2 py-1 text-emerald-200" *ngIf="draftSaveStatus">{{
      draftSaveStatus
    }}</span>
    <span class="rounded-full border border-rose-500/40 bg-rose-500/10 px-2 py-1 text-rose-200" *ngIf="draftSaveError">{{
      draftSaveError
    }}</span>
    <span class="rounded-full border border-slate-700 px-2 py-1 text-slate-400" *ngIf="isAutosaving">Guardando…</span>
  </div>
  <p *ngIf="draftError" class="mt-2 text-xs text-rose-200">{{ draftError }}</p>
</div>
