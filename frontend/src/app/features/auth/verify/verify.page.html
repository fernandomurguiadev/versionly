<div class="auth-shell">
  <div class="auth-card">
    <h1>Verifica tu correo</h1>
    <p>Te enviamos un link para confirmar tu cuenta.</p>
    <div class="auth-actions">
      <button class="auth-primary" type="button" (click)="verify()">Ya verifiqué</button>
      <button class="auth-secondary" type="button" (click)="resend()">Reenviar correo</button>
    </div>
    <div class="auth-footer">
      ¿Necesitas ayuda?
      <a routerLink="/login">Volver al login</a>
    </div>
  </div>
</div>
